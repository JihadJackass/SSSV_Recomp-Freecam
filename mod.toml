# SSSV Recompiled - Free Camera mod manifest.

[manifest]
id = "sssv_freecam_mmb_orbit"
version = "1.2.0"
display_name = "Free Camera (Middle Mouse Orbit)"
description = """
Hold the Middle Mouse Button and move the mouse to freely orbit the camera \
around your animal. Works in the normal chase-camera modes; cutscene, \
waypoint, and fixed cameras are left untouched. The vanilla C-Left/C-Right \
45-degree snapping still works alongside it."""
short_description = "Hold MMB to freely orbit the camera with the mouse."
authors = [ "you" ]

# Target game ID as registered by SSSVRecompiled (src/main/main.cpp: mod_game_id = "sssv").
game_id = "sssv"

# SSSVRecompiled's version string at time of writing (src/main/main.cpp).
minimum_recomp_version = "0.1.2"

dependencies = [ ]
optional_dependencies = [ ]

# The companion library that reads SDL mouse state from the host process.
# The runtime loads "sssv_freecam_native" + platform extension (.dll/.so/.dylib)
# from the same folder as the .nrm file.
native_libraries = [
    { name = "sssv_freecam_native", funcs = ["SSSVFreeCam_PollMouse"] }
]

[inputs]
elf_path = "build/mod.elf"
mod_filename = "sssv_freecam_mmb_orbit"

# Reference symbols copied from SSSV_Recomp/SSSVRecompSyms.
func_reference_syms_file = "syms/sssv.us.syms.toml"
data_reference_syms_files = [ "syms/sssv.us.datasyms.toml" ]

additional_files = [ ]

# ---------------------------------------------------------------------------
# In-game Configure menu options
# ---------------------------------------------------------------------------

[[manifest.config_options]]
id = "recenter_delay"
name = "Recenter delay (seconds)"
description = "How long after releasing the middle mouse button before the camera starts drifting back behind your animal. Set to 0 for vanilla-style immediate recentering."
type = "Number"
min = 0
max = 30
step = 0.5
precision = 1
percent = false
default = 3

[[manifest.config_options]]
id = "never_recenter"
name = "Never recenter"
description = "When enabled, the camera always stays where you put it and never drifts back on its own (overrides the delay slider). Wall avoidance still works."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "sensitivity"
name = "Orbit sensitivity"
description = "Camera rotation per mouse movement."
type = "Number"
min = 0.05
max = 1.0
step = 0.01
precision = 2
percent = false
default = 0.22

[[manifest.config_options]]
id = "invert_x"
name = "Invert horizontal"
description = "Invert the orbit direction."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"
